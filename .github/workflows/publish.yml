# Public-repo publish workflow (BitModern/levr).
# Tracked in the monorepo (scripts/export/templates/) and copied verbatim by
# scripts/export/levr.mjs — edit it here, never in the public repo.
name: publish

on:
  push:
    tags:
      # ENG-2867 K-002: a broad glob, not per-package literals. A hardcoded
      # tag list is itself a silent trap — a third package's tag would never
      # START this workflow, so the loud prefix whitelist in the resolve job
      # below would be unreachable and the only remaining signal would be
      # the export's non-blocking npm poll. Any `<pkg>-v*` tag starts a run;
      # an unknown prefix then fails LOUDLY at the whitelist.
      - '*-v*'

jobs:
  # ENG-2867 D5: package resolution is its own job so the publish job's
  # concurrency group can derive from it. The old workflow-level group used a
  # binary auth-or-cli expression — a third package would silently share the
  # cli group, re-opening the ENG-2797 class that group was written to close.
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pkg: ${{ steps.pkg.outputs.pkg }}
      pkgs: ${{ steps.pkg.outputs.pkgs }}
    steps:
      - name: Resolve package name from the tag prefix
        id: pkg
        run: |
          # auth-v1.2.3 -> auth ; cli-v1.2.3 -> cli
          PKG="${GITHUB_REF_NAME%%-v*}"
          if [ "$PKG" != "auth" ] && [ "$PKG" != "cli" ]; then
            echo "Unrecognized tag prefix: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          # G-001: `pkgs` is a one-element JSON ARRAY, under its own name —
          # the publish matrix `fromJson`s it, and fromJson of a bare string
          # is a hard matrix parse error that would fail EVERY publish the
          # moment it deploys. `pkg` (the bare string) stays for the steps.
          echo "pkgs=[\"$PKG\"]" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        pkg: ${{ fromJson(needs.resolve.outputs.pkgs) }}
    # ENG-2797: keyed on the PACKAGE, not the ref and not the scope.
    #
    # `publish-${{ github.ref }}` was one group per TAG, so re-running a tag or
    # re-pushing it could publish the same package twice at once. A scope-wide
    # group fixes that but overshoots: GitHub keeps only ONE pending run per group
    # (`cancel-in-progress: false` governs the RUNNING one, not the queue), so a
    # second release landing while the first is mid-flight would silently cancel a
    # queued publish — converting an impossible failure into a routine one.
    #
    # Per-package serialises what can actually collide. npm packuments are
    # per-package, so `@levr-one/auth` and `@levr-one/cli` do not contend for the
    # same document; the `E409 Conflict - Failed to save packument` that dropped
    # auth@1.0.2 on 2026-07-31 was therefore probably registry-side rather than a
    # write race between the two. The retry below and the export's verify-poll are
    # what actually cover that; this group's job is narrower and provable.
    #
    # ENG-2867 D5 (AUDIT-3/G-001): the group derives from the resolved package
    # via a single-element matrix — `matrix.` in a job-level concurrency group
    # is the proven shape in this ecosystem, and it is generic: a third
    # package serialises on its own group instead of silently sharing cli's.
    concurrency:
      group: publish-${{ matrix.pkg }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: yarn install --no-immutable

      # The cli ships PRE-BUILT from the monorepo (its dist/ is bundled +
      # brand-scrubbed and copied verbatim by the export) — @testlm/sdk /
      # @testlm/ci-env are bundled in and don't exist in this mirror workspace,
      # so a rebuild here would fail. auth still builds from source (D3/C1).
      # A third package hits the else-branch build — loud if wrong (Q6).
      - name: Build
        run: |
          PKG="${{ matrix.pkg }}"
          if [ "$PKG" = "cli" ]; then
            echo "cli ships prebuilt from the monorepo — skipping build."
          else
            yarn workspace @levr-one/${PKG} build
          fi

      # ENG-2797: retry transient registry failures. E409 "Failed to save
      # packument" is npm-side and retry-safe — the 2026-07-31 auth@1.0.2 loss
      # succeeded on a manual re-run with no other change. The concurrency
      # group above makes it far less likely; this is the backstop for the
      # rest (5xx, ETIMEDOUT, a same-scope publish from anywhere else).
      #
      # Only retries when the version is genuinely absent: a publish that
      # actually succeeded and then hit a network blip would otherwise retry
      # into E403 "cannot publish over previously published version", turning
      # a success into a red run. Checked BEFORE each attempt, so the loop
      # also exits cleanly if a concurrent run beat us to it.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PKG: ${{ matrix.pkg }}
        run: |
          set -uo pipefail
          NAME="@levr-one/${PKG}"
          VERSION="$(node -p "require('./packages/${PKG}/package.json').version")"
          echo "Publishing ${NAME}@${VERSION}"

          for attempt in 1 2 3; do
            # --prefer-online: `npm view` is CDN-cached, and a stale MISS here
            # would send us into a republish of something already live.
            if npm view --prefer-online "${NAME}@${VERSION}" version >/dev/null 2>&1; then
              echo "${NAME}@${VERSION} is already on npm — nothing to do."
              exit 0
            fi

            OUT="$(npm publish -w "${NAME}" --access public 2>&1)" && {
              echo "${OUT}"
              echo "Published ${NAME}@${VERSION} on attempt ${attempt}."
              exit 0
            }
            echo "${OUT}"

            # A publish that landed and then lost the response leaves the
            # registry holding the version while npm reports E403 "cannot
            # publish over previously published version". That is a SUCCESS
            # mis-reported as a failure — the exact outcome the pre-check is
            # meant to avoid, reachable whenever CDN caching hides a version
            # for longer than the backoff window.
            case "${OUT}" in
              *EPUBLISHCONFLICT*|*"cannot publish over"*|*"You cannot publish over"*)
                if npm view --prefer-online "${NAME}@${VERSION}" version >/dev/null 2>&1; then
                  echo "${NAME}@${VERSION} is on npm — an earlier attempt succeeded. Treating as published."
                  exit 0
                fi
                ;;
            esac

            if [ "${attempt}" -lt 3 ]; then
              BACKOFF=$((attempt * 20))
              echo "::warning::publish attempt ${attempt} for ${NAME}@${VERSION} failed — retrying in ${BACKOFF}s."
              sleep "${BACKOFF}"
            fi
          done

          echo "::error::${NAME}@${VERSION} failed to publish after 3 attempts." >&2
          exit 1
